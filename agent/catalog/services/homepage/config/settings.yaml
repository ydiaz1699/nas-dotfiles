# Homepage — Configuración general
# Docs: https://gethomepage.dev/configs/settings/

title: NAS Dashboard
description: Panel de control del homelab

theme: dark
color: slate

language: es

layout:
  Redes:
    style: row
    columns: 2
  IoT:
    style: row
    columns: 2
  Archivos:
    style: row
    columns: 2
  Bases de datos:
    style: row
    columns: 1
  Sistema:
    style: row
    columns: 2

providers:
  openweathermap: openweathermapapikey
  weatherapi: weatherapiapikey
