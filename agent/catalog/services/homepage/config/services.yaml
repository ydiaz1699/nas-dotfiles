# Homepage — Servicios del NAS
# Docs: https://gethomepage.dev/configs/services/

- Red & DNS:
    - AdGuard Home:
        icon: adguard-home
        href: http://192.168.1.200:80
        description: Bloqueador de anuncios y DNS
        widget:
          type: adguard
          url: http://192.168.1.200:80

- IoT & Domótica:
    - EMQX:
        icon: emqx
        href: http://192.168.1.200:18083
        description: Broker MQTT para IoT
        widget:
          type: emqx
          url: http://192.168.1.200:18083

    - ESPHome:
        icon: esphome
        href: http://192.168.1.200:6052
        description: Firmware ESP32/ESP8266

- Almacenamiento:
    - File Browser:
        icon: filebrowser
        href: http://192.168.1.200:8085
        description: Explorador de archivos web

    - USB Manager:
        icon: usb
        href: http://192.168.1.200:8091
        description: Dispositivos USB conectados
        widget:
          type: customapi
          url: http://192.168.1.200:8091/usb/list
          refreshInterval: 10000
          mappings:
            - field: count
              label: USBs montados
              format: number

- Base de Datos:
    - pgAdmin:
        icon: pgadmin
        href: http://192.168.1.200:5050
        description: Administrador PostgreSQL

- Sistema:
    - ntfy:
        icon: ntfy
        href: http://192.168.1.200:8090
        description: Notificaciones push
        widget:
          type: customapi
          url: http://ntfy:80/v1/stats
          refreshInterval: 30000
          mappings:
            - field: messages
              label: Mensajes (24h)
              format: number

    - Homepage:
        icon: homepage
        href: http://192.168.1.200:3000
        description: Este dashboard
