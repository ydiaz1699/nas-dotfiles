# Despliegue final en $dkco/datasql/compose.yml.
# En el catálogo, extends usa ../../_common.yml; en el NAS usa ../_common.yml.
# ParadeDB reemplaza al PostgreSQL antiguo y conserva los nombres operativos
# datapostgres, datapgadmin y dataredis.
services:
  postgres:
    extends:
      file: ../../_common.yml
      service: _defaults
    image: paradedb/paradedb:0.25.4-pg17
    container_name: datapostgres
    env_file:
      - ../.env
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    # PostgreSQL solo se publica en loopback para Home Assistant host-network.
    ports:
      - "127.0.0.1:${AIPG_POSTGRES_HOST_PORT:-5432}:5432"
    command:
      - postgres
      - "-c"
      - shared_preload_libraries=pg_search,pg_cron
      - "-c"
      - "cron.database_name=${POSTGRES_DB}"
    volumes:
      - ./data/postgres/pgdata:/var/lib/postgresql/data/pgdata
      - ./data/postgres/backups:/backups
    networks:
      - db_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1536M
        reservations:
          cpus: '0.25'
          memory: 256M

  pgadmin:
    # pgAdmin usa sudo internamente; no heredar security_opt/cap_drop.
    image: dpage/pgadmin4:9.17
    container_name: datapgadmin
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - ../.env
      - .env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "True"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - ./data/pgadmin:/var/lib/pgadmin
    ports:
      - "${AIPGADMIN_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - db_net
    labels:
      - homepage.group=Bases de datos
      - homepage.name=pgAdmin
      - homepage.icon=pgadmin
      - homepage.href=http://${SERVER_IP}:${AIPGADMIN_PORT:-5050}
      - homepage.description=Administración de PostgreSQL IA
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  redis:
    extends:
      file: ../../_common.yml
      service: _defaults
    image: redis:7-alpine
    container_name: dataredis
    env_file:
      - ../.env
      - .env
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - "${REDIS_PASSWORD}"
    volumes:
      - ./data/redis:/data
    networks:
      - db_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETUID, SETGID]
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

networks:
  db_net:
    external: true
