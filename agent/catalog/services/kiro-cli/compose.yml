services:
  kiro-cli:
    build: .
    image: kiro-cli-nas:local
    container_name: kiro-cli
    network_mode: host               # ve localhost:5572 (rclone) y LAN 192.168.1.200 (n8n, karakeep)
    stdin_open: true                 # interactivo (TUI)
    tty: true
    volumes:
      - ./data:/home/kiro            # persiste sesiones, login, config y mcp.json
