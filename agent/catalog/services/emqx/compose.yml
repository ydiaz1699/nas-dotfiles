# $dkco/emqx/compose.yml
services:
  emqx:
    extends:
      file: ../../_common.yml
      service: _defaults
    image: emqx/emqx:5.8.3
    container_name: emqx
    hostname: emqx.iot_net
    env_file:
      - ../.env
      - .env
    environment:
      EMQX_NODE__NAME: "emqx@emqx.iot_net"
      EMQX_NODE__COOKIE: "${EMQX_NODE_COOKIE}"
      EMQX_NODE__ROLE: core
      EMQX_CLUSTER__DISCOVERY_STRATEGY: manual
      EMQX_DASHBOARD__DEFAULT_USERNAME: "${EMQX_DASHBOARD_USER}"
      EMQX_DASHBOARD__DEFAULT_PASSWORD: "${EMQX_DASHBOARD_PASSWORD}"
      EMQX_ALLOW_ANONYMOUS: "${EMQX_ALLOW_ANONYMOUS:-false}"
      EMQX_LOG__CONSOLE_HANDLER__LEVEL: warning
      EMQX_MQTT__SESSION_EXPIRY_INTERVAL: 1h
      EMQX_MQTT__MAX_TOPIC_LEVELS: 7
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 256m
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    healthcheck:
      test: ["CMD", "emqx", "ctl", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    volumes:
      - ./data/data:/opt/emqx/data
      - ./data/log:/opt/emqx/log
    ports:
      - "${EMQX_PORT_MQTT:-1883}:1883"
      - "${EMQX_PORT_MQTTS:-8883}:8883"
      - "${EMQX_PORT_WS:-8083}:8083"
      - "${EMQX_PORT_WSS:-8084}:8084"
      - "${EMQX_PORT_DASHBOARD:-18083}:18083"
    labels:
      - homepage.group=IoT
      - homepage.name=EMQX
      - homepage.icon=emqx
      - homepage.href=http://${SERVER_IP}:${EMQX_PORT_DASHBOARD:-18083}
      - homepage.description=Broker MQTT para IoT
    networks:
      - iot_net
      - db_net

networks:
  iot_net:
    external: true
  db_net:
    external: true
