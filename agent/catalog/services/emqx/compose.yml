# $dkco/emqx/compose.yml
x-common-env: &common-env
  TZ: ${TZ}
x-common-ports: &common-ports
  - "${EMQX_PORT_MQTT}:1883"
  - "${EMQX_PORT_MQTTS}:8883"
  - "${EMQX_PORT_WS}:8083"
  - "${EMQX_PORT_WSS}:8084"
  - "${EMQX_PORT_DASHBOARD}:18083"
x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 10s
  retries: 5
  start_period: 40s
x-security-defaults: &security-defaults
  security_opt:
    - no-new-privileges:true
  ulimits:
    nofile:
      soft: 1048576
      hard: 1048576
x-logging-defaults: &logging-defaults
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
x-resource-defaults: &resource-defaults
  deploy:
    resources:
      limits:
        memory: 1g
      reservations:
        memory: 256m

services:
  emqx:
    image: emqx/emqx:5.8.3
    container_name: emqx
    hostname: emqx.iot_net
    restart: unless-stopped
    <<: [*security-defaults, *resource-defaults]
    environment:
      <<: *common-env
      EMQX_NODE__NAME: "emqx@emqx.iot_net"
      EMQX_NODE__COOKIE: "${EMQX_NODE_COOKIE}"
      EMQX_NODE__ROLE: core
      EMQX_CLUSTER__DISCOVERY_STRATEGY: manual
      EMQX_DASHBOARD__DEFAULT_USERNAME: "${EMQX_DASHBOARD_USER}"
      EMQX_DASHBOARD__DEFAULT_PASSWORD: "${EMQX_DASHBOARD_PASSWORD}"
      EMQX_ALLOW_ANONYMOUS: "${EMQX_ALLOW_ANONYMOUS:-false}"
      EMQX_LOG__CONSOLE_HANDLER__LEVEL: warning
      EMQX_MQTT__SESSION_EXPIRY_INTERVAL: 1h
      EMQX_MQTT__MAX_TOPIC_LEVELS: 7
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "emqx", "ctl", "status"]
    logging: *logging-defaults
    volumes:
      - ./data/data:/opt/emqx/data
      - ./data/log:/opt/emqx/log
    ports: *common-ports
    labels:
      - homepage.group=IoT
      - homepage.name=EMQX
      - homepage.icon=emqx
      - homepage.href=http://192.168.1.200:${EMQX_PORT_DASHBOARD}
      - homepage.description=Broker MQTT para IoT
    networks:
      - iot_net
      - db_net

networks:
  iot_net:
    external: true
  db_net:
    external: true
