[project]
name = "nas-dotfiles"
version = "1.0.0"
description = "NAS/Homelab administration framework with AI agent"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
python_classes = ["Test*"]

[tool.coverage.run]
source = ["agent"]
omit = ["agent/tools/_shell.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true
