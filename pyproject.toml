[project]
name = "nas-dotfiles"
version = "0.1.0"
description = "Agente inteligente para administración de NAS/Homelab con Docker"
requires-python = ">=3.9"

[tool.ruff]
target-version = "py39"
line-length = 100
src = ["agent", "tests"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "RUF",   # ruff-specific rules
]
ignore = [
    "E501",   # line too long (manejado por formatter)
    "B008",   # do not perform function calls in argument defaults
    "SIM108", # ternary operator (a veces es menos legible)
    "UP007",  # X | Y union syntax (necesitamos compat con 3.9)
]

[tool.ruff.lint.isort]
known-first-party = ["agent"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
